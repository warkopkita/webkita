x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE:-webkita_db}
  DB_USERNAME: ${DB_USERNAME:-webkita_user}
  DB_PASSWORD: ${DB_PASSWORD:-Secret2026Webkita!}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  SESSION_DRIVER: redis

services:
  # ==========================================
  # 1. PHP-FPM Application Service
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: webkita-app:latest
    container_name: webkita_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *app-environment
    volumes:
      - storage_data:/var/www/html/storage
      - ./database:/var/www/html/database
      - ./resources:/var/www/html/resources
      - ./app:/var/www/html/app
      - ./routes:/var/www/html/routes
    networks:
      - webkita-net
    depends_on:
      - db
      - redis

  # ==========================================
  # 2. Nginx Web Server Service
  # ==========================================
  web:
    image: nginx:1.25-alpine
    container_name: webkita_web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - storage_data:/var/www/html/storage:ro
    networks:
      - webkita-net
    depends_on:
      - app

  # ==========================================
  # 3. MySQL 8 Database Service
  # ==========================================
  db:
    image: mysql:8.0
    container_name: webkita_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-webkita_db}
      MYSQL_USER: ${DB_USERNAME:-webkita_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-Secret2026Webkita!}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-RootSecret2026!}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - webkita-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s

  # ==========================================
  # 4. Redis Cache & Queue Broker
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: webkita_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - webkita-net

  # ==========================================
  # 5. Background Queue Worker Service
  # ==========================================
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: webkita-app:latest
    container_name: webkita_queue
    restart: unless-stopped
    entrypoint: []
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90", "--verbose"]
    env_file:
      - .env
    environment:
      <<: *app-environment
    volumes:
      - storage_data:/var/www/html/storage
      - ./resources:/var/www/html/resources
      - ./app:/var/www/html/app
      - ./routes:/var/www/html/routes
    networks:
      - webkita-net
    depends_on:
      - app
      - db
      - redis

  # ==========================================
  # 6. Task Scheduler (Cron Runner)
  # ==========================================
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: webkita-app:latest
    container_name: webkita_scheduler
    restart: unless-stopped
    entrypoint: []
    command: ["sh", "-c", "while true; do php /var/www/html/artisan schedule:run --verbose --no-interaction; sleep 60; done"]
    env_file:
      - .env
    environment:
      <<: *app-environment
    volumes:
      - storage_data:/var/www/html/storage
      - ./resources:/var/www/html/resources
      - ./app:/var/www/html/app
      - ./routes:/var/www/html/routes
    networks:
      - webkita-net
    depends_on:
      - app

# ==========================================
# Volumes & Networks
# ==========================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local

networks:
  webkita-net:
    driver: bridge
